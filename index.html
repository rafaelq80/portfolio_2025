<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- Servidores de Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonte do Google - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Portfólio do Rafael, desenvolvedor web fullstack.">
    <meta name="author" content="Rafael Queiróz">
    <meta name="keywords" content="portfólio, desenvolvedor, web, fullstack, Rafael Queiróz, HTML, CSS, JavaScript">
    
    <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg" />

    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css" />

    <title>Portfólio do Rafael</title>
    
</head>

<body>
    <!-- MENU -->
    <header class="flex menu_container">
        <div class="menu_content">
            <div id="titulo">
                <a href="#">Portfolio</a>
            </div>
            <nav>
                <ul class="flex menu_list">
                    <li><a href="#hero">Início</a></li>
                    <li><a href="#about">Sobre</a></li>
                    <li><a href="#contact">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- HERO -->
        <section id="hero" class="hero_container">
            <div class="hero_content">
                <h4>👋 Olá, eu sou Rafael</h4>
                <h1>Desenvolvedor Full Stack</h1>
                <p>Transformo ideias em código e crio experiências digitais incríveis.</p>
                <div class="hero_buttons">
                    <a href="#contact" class="botao">Entre em Contato</a>
                    <a href="#about" class="botao-outline">Saiba Mais</a>
                </div>
            </div>
            <div class="hero_image">
                <img 
                    src="./assets/img/dev_man.svg" 
                    alt="Ilustração de desenvolvedor trabalhando"
                    class="illustration float-animation"
                >
            </div>
        </section>

        <!-- ABOUT -->
        <section id="about" class="about_container">
           
        </section>

        <!-- CONTACT -->
        <section id="contact" class="contact_container">
            <div class="contact_info">
                <h4>Entre em Contato</h4>
                <p>Sinta-se à vontade para entrar em contato comigo!</p>
                <div class="social_container">
                    <a href="#" target="_blank" class="social_icon">
                        <img src="./assets/img/linkedin.svg" alt="LinkedIn">
                    </a>
                    <a href="#" target="_blank" class="social_icon">
                        <img src="./assets/img/github.svg" alt="GitHub">
                    </a>
                    <a href="#" target="_blank" class="social_icon">
                        <img src="./assets/img/instagram.svg" alt="Instagram">
                    </a>
                    <a href="#" target="_blank" class="social_icon">
                        <img src="./assets/img/facebook.svg" alt="Facebook">
                    </a>
                </div>
            </div>

            <form action="https://formsubmit.co/7065d88cfa92a310a1da3b7a5effb0c9" method="POST" id="formulario">

                <input type="hidden" name="_next" value="http://127.0.0.1:5500/sucess.html">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="box">
                <input type="hidden" name="_subject" value="Nova mensagem do Portfólio!">
                
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" placeholder="Seu nome completo">
                <span id="txtNome"></span>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="seu@email.com">
                <span id="txtEmail"></span>

                <label for="assunto">Assunto</label>
                <input id="assunto" name="assunto" type="text" placeholder="Assunto da mensagem">
                <span id="txtAssunto"></span>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..."></textarea>

                <button class="botao" type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        Feito com ❤️ por Rafael Queiróz - 2025
    </footer>

    <!-- Script JavaScript -->
    <script src="./assets/js/scripts.js"></script> 

</body>

</html>
